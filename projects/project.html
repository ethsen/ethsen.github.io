<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project | Ethan Senatore</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="../assets/js/main.js"></script>
  <script defer src="../assets/js/project.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>

<body class="page-project">
  <header class="topbar">
    <nav class="nav">
      <a class="brand" href="../">
        <span class="brand__mark">◇</span>
        <span class="brand__text">Ethan Senatore</span>
      </a>
      <div class="nav__links">
        <a class="btn btn--small btn--ghost" href="../about/">About</a>
        <button class="btn btn--small btn--ghost" id="theme-toggle" type="button">Dark mode</button>
      </div>
    </nav>
  </header>

  <main class="container">
    <header class="article-hero">
      <p id="proj-kicker" class="kicker">project</p>
      <h1 id="proj-title">Project title</h1>
      <p id="proj-subtitle" class="muted">Short project subtitle goes here.</p>

      <div class="row row--wrap article-tags" id="proj-tags"></div>

      <div class="row row--wrap article-actions">
        <a id="btn-glance" class="btn btn--small" href="#">At-a-glance</a>
        <a id="btn-deep" class="btn btn--small btn--ghost" href="#">In-depth</a>
      </div>

      <div class="row row--wrap article-links" id="proj-links"></div>
    </header>

    <div class="article-wrap">
      <article id="proj-body" class="proj-body article-content"></article>
      <aside id="proj-aside" class="article-aside" aria-label="Article sidebar">
        <div class="card toc">
          <h4>In this article</h4>
          <div id="proj-toc" class="toc__links"></div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="muted">© <span id="year"></span> Ethan Senatore</span>
      <span class="muted">projects</span>
    </div>
  </footer>
</body>
</html>
